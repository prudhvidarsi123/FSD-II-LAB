<!DOCTYPE html>
<html>
<head>
    <title>Event Listener Example</title>
</head>
<body>

    <h1>JavaScript Event Listener</h1>
    
    <button id="clickButton">Click Me</button>
    <p id="message"></p>
    
    <input type="text" id="textInput" placeholder="Type something..." />
    <p id="inputDisplay"></p>
    
    <!-- Fixed the space typo in background-color -->
    <div id="hoverBox" style="width:200px; height:100px; background-color:lightblue; margin-top:20px; display:flex; align-items:center; justify-content:center; font-family:sans-serif; cursor:pointer;">
        Hover over this box
    </div>

    <script>
        // 1. Button click event
        document.getElementById("clickButton").addEventListener("click", () => {
            document.getElementById("message").innerText = "Button clicked!";
        });

        // 2. Input field real-time change event
        document.getElementById("textInput").addEventListener("input", (event) => {
            document.getElementById("inputDisplay").innerText = `You typed: ${event.target.value}`;
        });

        // 3. Hover box color transitions
        const hoverBox = document.getElementById("hoverBox");
        
        hoverBox.addEventListener("mouseover", () => {
            hoverBox.style.backgroundColor = "orange";
        });

        hoverBox.addEventListener("mouseout", () => {
            hoverBox.style.backgroundColor = "lightblue";
        });
    </script>

</body>
</html>
